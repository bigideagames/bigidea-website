  .mode{--face:#bcf525,#86e22a 50%,#61da29;--rim:#ecffb4;--keyline:#1d5a08;--lip:#3a9a14;--ink:#226a0a;

  .stage{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#061426e6;backdrop-filter:blur(6px)}

<div id="stage" class="stage" hidden><button class="close" type="button" aria-label="Back to the modes">×</button><iframe title="Superstar Hockey" allow="autoplay; fullscreen"></iframe></div>
<script>
  const desktop=matchMedia('(min-width:700px) and (min-height:560px) and (pointer:fine)');
  const stage=document.getElementById('stage'),frame=stage.querySelector('iframe'),close=stage.querySelector('.close');
  for(const mode of document.querySelectorAll('a.mode'))mode.addEventListener('click',event=>{
    if(!desktop.matches)return;
    event.preventDefault();stage.hidden=false;
    const url=new URL(mode.href);url.searchParams.set('controls','buttons');frame.src=url.href;
    // The game takes the keyboard; Escape inside it (same origin) closes the frame too.
    frame.addEventListener('load',()=>{frame.focus();frame.contentWindow.addEventListener('keydown',escape);},{once:true});
  });
  const escape=event=>{if(event.key==='Escape'&&!stage.hidden)close.click();};
  close.addEventListener('click',()=>{stage.hidden=true;frame.src='about:blank';});
  addEventListener('keydown',escape);
</script>
